apps:
  - script: ./build/web.js
    name: 'web'
    node_args: --nouse-idle-notification --expose-gc --inspect
    env:
      HOST: '127.0.0.1'
      HOSTURL: 'https://pixelplanet.example'
      ASSET_SERVER: 'https://pixelplanet.example'
      PORT: 3000
      REDIS_URL: 'redis://localhost:6379'
      MYSQL_HOST: 'localhost'
      MYSQL_USER: 'pixelarea_app'
      MYSQL_DATABASE: 'pixelplanet'
      LOG_MYSQL: 1
      MYSQL_PW: ''
      SESSION_SECRET: ''
      APISOCKET_KEY: ''
      ADMIN_IDS: '1,2'
